name: Keep-Alive Ping

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend & Supabase Database
        # Hitting /api/career-graph/pathing queries the database, keeping both Render and Supabase awake
        run: curl -sSf https://nexis-backend-4e26.onrender.com/api/career-graph/pathing > /dev/null || echo "Render ping failed, but requested"

      - name: Ping Vercel Frontend
        # Keep the Vercel edge functions warm
        run: curl -sSf https://nexis-forge-1h4ob2wrf-master-bhogals-projects.vercel.app > /dev/null || echo "Vercel ping failed, but requested"
